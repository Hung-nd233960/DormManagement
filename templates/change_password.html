<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — DormChores</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-header">
    <div class="auth-icon">🔑</div>
    <h1>Change Password</h1>
    {% if user.force_password_change %}
    <p class="text-warning">You must set a new password before continuing.</p>
    {% else %}
    <p>Choose a new secure password.</p>
    {% endif %}
  </div>

  {% for f in flashes %}
  <div class="flash flash-{{ f.category }}">{{ f.message }}</div>
  {% endfor %}

  <form method="POST" action="/auth/change-password" class="auth-form">
    <div class="form-group">
      <label for="current_password">Current Password</label>
      <input id="current_password" name="current_password" type="password" required autofocus>
    </div>
    <div class="form-group">
      <label for="new_password">New Password</label>
      <input id="new_password" name="new_password" type="password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm New Password</label>
      <input id="confirm_password" name="confirm_password" type="password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-full">Change Password</button>
  </form>

  {% if not user.force_password_change %}
  <div style="text-align:center; margin-top:1rem;">
    <a href="/today" class="text-muted">Cancel</a>
  </div>
  {% else %}
  <div style="text-align:center; margin-top:1rem;">
    <form method="POST" action="/auth/logout" style="display:inline">
      <button type="submit" class="btn btn-ghost btn-sm">Logout instead</button>
    </form>
  </div>
  {% endif %}
</div>
</body>
</html>
